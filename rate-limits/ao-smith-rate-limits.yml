description: >-
  A. O. Smith documents no API rate limits. There is no developer reference, no published
  throttling policy, and no documented response headers, because there is no published API
  — the only live surface is an undocumented Apollo GraphQL endpoint serving the iCOMM
  mobile app. An honest zero: nothing about A. O. Smith's runtime limit behaviour is
  knowable from what they publish.
note: >-
  REPLACES A FABRICATED SCAFFOLD. Until 2026-09-02 this file asserted five rate limits
  (10/100/1000 requests per minute across free/professional/enterprise tiers), an
  X-RateLimit-* header family and a RateLimit-Policy header, none of which A. O. Smith has
  ever published. It was written by the 2026-05-04 bulk sweep (roadmap#35). Per STEP 24,
  undocumented limits are recorded as limit_count 0 rather than as placeholder numbers —
  this deliberately drops the agent-readiness `rate_limit_signal` credit the invented
  artifact was earning.
