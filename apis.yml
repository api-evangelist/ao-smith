apis:
  - name: AO Smith iCOMM Connected Technology
    description: >-
      AO Smith's iCOMM connected technology platform enables remote monitoring and control
      of compatible AO Smith water heaters through the A. O. Smith and iCOMM Connectivity
      mobile apps — tracking water and energy usage, setting temperature, enabling vacation
      mode, and receiving leak and maintenance alerts. It is NOT a published developer API.
      The base URL below is the Apollo GraphQL endpoint the mobile apps call; it was
      established as A. O. Smith infrastructure because r2.wh8.co CNAMEs to
      router-default.apps.aosmith-prod.hd1m.p1.openshiftapps.com, the same OpenShift
      cluster that serves A. O. Smith's 3scale portal. It is undocumented, credentialed,
      and returns "GraphQL introspection is not allowed" to any schema query. The value
      previously recorded here, https://api.aosmith.com, has no DNS record at all.
    image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
    humanURL: https://www.hotwater.com/water-heaters/residential/connected/
    baseURL: https://r2.wh8.co
    tags:
      - Connected Products
      - IoT
      - Smart Home
      - Water Heaters
