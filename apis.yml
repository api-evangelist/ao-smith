name: AO Smith
description: >-
  A. O. Smith Corporation (NYSE: AOS) is a global manufacturer of residential and
  commercial water heaters, boilers, water treatment and air purification products,
  headquartered in Milwaukee, Wisconsin. Its connected-product line runs on the iCOMM
  platform, which lets homeowners and plumbing professionals monitor and control
  compatible water heaters — temperature, vacation mode, leak and maintenance alerts,
  energy-use history — from a mobile app. A. O. Smith operates no public developer
  program: there is no developer portal, API reference, OpenAPI, SDK or MCP server, and
  the iCOMM backend is an undocumented GraphQL endpoint reachable only by the mobile apps
  and by community clients that reverse-engineered it.
