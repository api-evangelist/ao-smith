description: >-
  A. O. Smith publishes NO API plans or pricing of any kind. The iCOMM connected-water-heater
  platform is bundled with the hardware and consumed through the free A. O. Smith / iCOMM
  mobile apps; there is no developer tier, no metered API product, no rate card, and no
  "contact sales for API access" page. An honest zero.
note: >-
  REPLACES A FABRICATED SCAFFOLD. Until 2026-09-02 this file carried three invented tiers
  (ao-smith-free / ao-smith-pro / ao-smith-enterprise) with invented quotas of 1,000 and
  100,000 requests per month against a base URL, https://api.aosmith.com, that does not
  resolve in DNS. None of it was published by A. O. Smith. It was written by the
  2026-05-04 bulk sweep (roadmap#35) and is removed here rather than carried forward —
  per STEP 23 an unpublished plan set is recorded as plan_count 0, not as placeholder tiers.
